<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление задачами</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
    <div class="container py-4">
        <h1 class="text-center mb-4">Управление задачами</h1>
        
        <div class="row mb-4">
            <div class="col-md-6 mx-auto">
                <div class="input-group">
                    <input type="text" class="form-control" id="taskInput" placeholder="Введите задачу...">
                    <select class="form-select" id="columnSelect" style="max-width: 130px;">
                        <option value="todo">Сделать</option>
                        <option value="inprogress">В работе</option>
                        <option value="done">Готово</option>
                    </select>
                    <button class="btn btn-primary" type="button" onclick="addTask()">
                        <i class="bi bi-plus-lg"></i> Добавить
                    </button>
                </div>
            </div>
        </div>

        <div class="row g-4">
            <div class="col-md-4">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">Сделать</h5>
                        <span class="badge bg-light text-primary" id="todoCount">0</span>
                    </div>
                    <div class="card-body" style="min-height: 400px;">
                        <div class="task-list" id="todoList">
                        </div>
                    </div>
                    <div class="card-footer">
                        <button class="btn btn-outline-danger btn-sm w-100" onclick="clearColumn('todo')">
                            <i class="bi bi-trash"></i> Очистить колонку
                        </button>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card shadow-sm">
                    <div class="card-header bg-warning text-white d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">В работе</h5>
                        <span class="badge bg-light text-warning" id="inprogressCount">0</span>
                    </div>
                    <div class="card-body" style="min-height: 400px;">
                        <div class="task-list" id="inprogressList">
                        </div>
                    </div>
                    <div class="card-footer">
                        <button class="btn btn-outline-danger btn-sm w-100" onclick="clearColumn('inprogress')">
                            <i class="bi bi-trash"></i> Очистить колонку
                        </button>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card shadow-sm">
                    <div class="card-header bg-success text-white d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">Готово</h5>
                        <span class="badge bg-light text-success" id="doneCount">0</span>
                    </div>
                    <div class="card-body" style="min-height: 400px;">
                        <div class="task-list" id="doneList">
                        </div>
                    </div>
                    <div class="card-footer">
                        <button class="btn btn-outline-danger btn-sm w-100" onclick="clearColumn('done')">
                            <i class="bi bi-trash"></i> Очистить колонку
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
